# ─────────────────────────────────────────────────────────────────────────────
# Backend CI — Python formatting, logic checks, tests, and Docker dependency locks
# Runs on pushes and PRs to main/dev when backend files or locked actions change
# ─────────────────────────────────────────────────────────────────────────────
name: Python CI

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
    paths:
      [
        'backend/**',
        'pyproject.toml',
        'uv.lock',
        '.github/workflows/backend.yaml',
        '.github/workflows/actions.lock'
      ]
  pull_request:
    branches: [main, dev]
    paths:
      [
        'backend/**',
        'pyproject.toml',
        'uv.lock',
        '.github/workflows/backend.yaml',
        '.github/workflows/actions.lock'
      ]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Ruff format check across supported Python versions ───────────────────
  format-check:
    name: Ruff Format (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5.1.0

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install formatter
        run: pip install "ruff>=0.15.5"

      - name: Verify formatting
        run: ruff format --check . --exclude .venv --exclude venv

      - name: Detect logic errors
        run: ruff check --select=F --ignore=F401,F403,F405,F541,F811,F841 --output-format=github .

  backend-tests:
    name: Backend Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONUTF8: '1'
      WEBUI_SECRET_KEY: synthetic-backend-ci-secret
      ENABLE_DB_MIGRATIONS: 'false'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.0'
          enable-cache: true

      - name: Install locked backend and test dependencies
        # Installing the project would run its frontend-building Hatch hook.
        run: uv sync --locked --no-install-project --python "${{ matrix.python-version }}"

      - name: Execute backend suite
        # Invoke the synced Python directly so uv run cannot install the project.
        env:
          DATA_DIR: ${{ runner.temp }}/backend-tests/data
          STATIC_DIR: ${{ runner.temp }}/backend-tests/static
          DATABASE_URL: sqlite:///${{ runner.temp }}/backend-tests/data/webui.db
        run: |
          mkdir -p "$DATA_DIR" "$STATIC_DIR"
          .venv/bin/python -m pytest backend/tests -q --basetemp "${{ runner.temp }}/backend-pytest"

  # ── Dockerfile lock files match the requirements files ───────────────────
  lock-check:
    name: Requirements locks up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5.1.0

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv==0.12.10

      - name: Regenerate locks
        run: backend/update-locks.sh

      - name: Verify locks are up to date
        run: test -z "$(git status --porcelain -- backend)"
