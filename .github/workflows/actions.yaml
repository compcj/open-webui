name: Workflow and Build Script Checks

on:
  push:
    branches: [main, dev]
    paths: ['.github/workflows/**', 'scripts/**', 'Dockerfile']
  pull_request:
    branches: [main, dev]
    paths: ['.github/workflows/**', 'scripts/**', 'Dockerfile']

permissions:
  contents: read

concurrency:
  group: actions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate workflow expressions and structure
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          sh scripts/check-workflows.sh "$RUNNER_TEMP/actionlint"

      - name: Test build and release scripts
        run: node --test scripts/*.test.js
