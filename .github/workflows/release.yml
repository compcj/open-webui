# ─────────────────────────────────────────────────────────────────────────────
# Release — Create GitHub release from CHANGELOG, trigger Docker builds
# Runs on pushes to main when package.json version changes
# ─────────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  # Retain version-changing pushes when later same-version pushes arrive.
  queue: max
  cancel-in-progress: false

jobs:
  # ── Create release and trigger downstream workflows ──────────────────────
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check version and prepare release notes
        id: release
        env:
          RELEASE_BEFORE: ${{ github.event.before }}
          RELEASE_HEAD: ${{ github.sha }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/release-notes.md
        run: node scripts/prepare-release.js

      - name: Publish GitHub release
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/release-notes.md
          RELEASE_HEAD: ${{ github.sha }}
        run: |
          if gh release view "v${RELEASE_VERSION}" &>/dev/null; then
            echo "Release v${RELEASE_VERSION} already exists — skipping creation"
          else
            gh release create "v${RELEASE_VERSION}" \
              --target "$RELEASE_HEAD" \
              --title "v${RELEASE_VERSION}" \
              --notes-file "$RELEASE_NOTES_PATH"
          fi

      - name: Archive source
        if: steps.release.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: |
            .
            !.git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Docker build
        if: steps.release.outputs.changed == 'true'
        uses: actions/github-script@v8
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docker.yaml',
              ref: `v${process.env.RELEASE_VERSION}`,
            })
